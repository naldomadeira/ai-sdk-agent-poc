name: ai-sdk-poc

services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-sdk-poc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-commerce}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    command: ["postgres", "-c", "timezone=America/Sao_Paulo", "-c", "log_statement=none"]
    ports:
      # 5467: 5432 ocupada por outro projeto e 5466 pela POC mastra-agent-poc.
      - "5467:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commerce} -d ${POSTGRES_DB:-commerce}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
